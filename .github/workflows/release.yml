name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from Cargo.toml
        id: get-version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"
      
      - name: Check if release exists
        id: check-release
        run: |
          if gh release view "${{ steps.get-version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            RELEASE_ID=$(gh release view "${{ steps.get-version.outputs.version }}" --json id -q .id)
            UPLOAD_URL=$(gh release view "${{ steps.get-version.outputs.version }}" --json uploadUrl -q .uploadUrl)
            echo "id=$RELEASE_ID" >> $GITHUB_OUTPUT
            echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create release
        id: create-release
        if: steps.check-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: ${{ steps.get-version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          
      - name: Output release info
        id: output-info
        run: |
          if [ "${{ steps.check-release.outputs.exists }}" = "true" ]; then
            echo "id=${{ steps.check-release.outputs.id }}" >> $GITHUB_OUTPUT
            echo "upload_url=${{ steps.check-release.outputs.upload_url }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ steps.create-release.outputs.id }}" >> $GITHUB_OUTPUT
            echo "upload_url=${{ steps.create-release.outputs.upload_url }}" >> $GITHUB_OUTPUT
          fi

  build-tauri-macos:
    needs: create-release
    uses: ./.github/workflows/tauri-build-common.yml
    with:
      platform: 'macos-latest'
      build-mode: 'release'
      release-tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  build-tauri-ubuntu:
    needs: create-release
    uses: ./.github/workflows/tauri-build-common.yml
    with:
      platform: 'ubuntu-latest'
      build-mode: 'release'
      release-tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  build-tauri-windows:
    needs: create-release
    uses: ./.github/workflows/tauri-build-common.yml
    with:
      platform: 'windows-latest'
      build-mode: 'release'
      release-tag: ${{ needs.create-release.outputs.version }}
    secrets: inherit
          
  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri-macos, build-tauri-ubuntu, build-tauri-windows]
    steps:
      - uses: actions/checkout@v4
      
      - name: Publish release
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}