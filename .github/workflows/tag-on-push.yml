name: Tag on Push to Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create_tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag
        run: |
          tag="build-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          git tag "$tag"
          git push origin "$tag"
